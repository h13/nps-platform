name: OpenTofu

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']

permissions:
  contents: read
  security-events: write

jobs:
  check:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.1'

      - name: OpenTofu Format Check
        run: tofu fmt -check -recursive

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: latest

      - name: TFLint Init
        run: tflint --init

      - name: TFLint
        run: tflint

      - name: Trivy Config Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          format: sarif
          output: trivy-results.sarif
          exit-code: 1
          trivy-config: infra/trivy.yaml
          version: 'v0.73.0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: ShellCheck
        run: shellcheck scripts/*.sh
