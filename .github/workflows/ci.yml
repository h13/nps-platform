name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commitlint (PR)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Lint & format check
        run: pnpm run lint && pnpm run format:check

      - name: Create .dev.vars for tests
        run: |
          cat <<'EOF' > .dev.vars
          NPS_API_KEY=test-api-key
          SENDGRID_API_KEY=SG.test-key
          GOOGLE_SERVICE_ACCOUNT_JSON={}
          SLACK_WEBHOOK_URL=https://hooks.slack.com/test
          EOF

      - name: Dead code detection
        run: pnpm run knip

      - name: TypeScript type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Run widget tests
        run: pnpm run test:widget

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Widget bundle size check
        run: |
          MAX_SIZE=51200  # 50 KB
          SIZE=$(wc -c < widget/dist/nps/widget.js)
          echo "Widget bundle size: ${SIZE} bytes (limit: ${MAX_SIZE})"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Widget bundle exceeds ${MAX_SIZE} bytes"
            exit 1
          fi

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
